sectionLabel:
  type: text
  label: Section label
  comment: Optional label to identify the section in the editor.
eyebrow:
  type: markdown
  label: Eyebrow
  comment: Short label shown above the heading.
  options:
    bold: true
    italic: true
    link: true
    subscript: true
    superscript: true
heading:
  type: markdown
  label: Heading
  comment: Main heading for the section.
  options:
    bold: true
    italic: true
    link: true
    subscript: true
    superscript: true
subtext:
  type: markdown
  label: Intro
  comment: Introductory paragraph beneath the heading.
  options:
    bold: true
    italic: true
    link: true
    subscript: true
    superscript: true
features:
  type: array
  label: Features
  comment: Illustrated features shown in the white card.
  options:
    structures: _structures.experienceFeatureItems
calloutHeading:
  type: markdown
  label: Callout heading
  comment: Heading shown in the call-to-action bar beneath the card.
  options:
    bold: true
    italic: true
    link: true
    subscript: true
    superscript: true
buttonSections:
  type: array
  label: Buttons
  comment: Buttons shown in the call-to-action bar.
  options:
    structures: _structures.buttonSections
maxContentWidth:
  type: select
  label: Max content width
  comment: Maximum width of the section content.
  options:
    values:
      - id: "none"
        name: "None"
      - id: "xs"
        name: "Extra Small"
      - id: "sm"
        name: "Small"
      - id: "md"
        name: "Medium"
      - id: "lg"
        name: "Large"
      - id: "xl"
        name: "Extra Large"
      - id: "2xl"
        name: "2xl"
      - id: "3xl"
        name: "3xl"
      - id: "512px"
        name: "512px (source max-w-lg)"
      - id: "576px"
        name: "576px (source max-w-xl)"
      - id: "672px"
        name: "672px (source max-w-2xl)"
      - id: "896px"
        name: "896px (source max-w-4xl)"
paddingHorizontal:
  type: select
  label: Horizontal padding
  comment: Horizontal padding around the section content.
  options:
    values:
      - id: "none"
        name: "None"
      - id: "xs"
        name: "Extra Small"
      - id: "sm"
        name: "Small"
      - id: "md"
        name: "Medium"
      - id: "lg"
        name: "Large"
      - id: "xl"
        name: "Extra Large"
      - id: "2xl"
        name: "2xl"
      - id: "3xl"
        name: "3xl"
paddingVertical:
  type: select
  label: Vertical padding
  comment: Vertical padding above and below the section content.
  options:
    values:
      - id: "none"
        name: "None"
      - id: "xs"
        name: "Extra Small"
      - id: "sm"
        name: "Small"
      - id: "md"
        name: "Medium"
      - id: "lg"
        name: "Large"
      - id: "xl"
        name: "Extra Large"
      - id: "2xl"
        name: "2xl"
      - id: "3xl"
        name: "3xl"
      - id: "6xl"
        name: "6xl"
colorScheme:
  type: select
  label: Color scheme
  comment: Color scheme applied to the section.
  options:
    values:
      - id: "inherit"
        name: "Inherit"
      - id: "light"
        name: "Light"
      - id: "dark"
        name: "Dark"
backgroundColor:
  type: select
  label: Background color
  comment: Background treatment behind the section.
  options:
    values:
      - id: "none"
        name: "None"
      - id: "base"
        name: "Base"
      - id: "surface"
        name: "Surface"
      - id: "accent"
        name: "Accent"
      - id: "highlight"
        name: "Highlight"
      - id: "sky"
        name: "Sky"
      - id: "mint"
        name: "Mint"
      - id: "mint-strong"
        name: "Mint Strong"
      - id: "mint-grid"
        name: "Mint Grid"
      - id: "peach"
        name: "Peach"
