            - dashboard
        picker_preview:
          text:
            - Carded logo grid
          icon:
            - dashboard
        _inputs:
          type:
            type: text
            hidden: true
          logos:
            type: array
            label: Logos
            comment: Brand logos in display order.
            options:
              structures: _structures.logoGridLogos
      - label: Scrolling logo carousel
        icon: view_carousel
        value:
          type: carousel
          logos: []
        preview:
          text:
            - Scrolling logo carousel
          icon:
            - view_carousel
        picker_preview:
          text:
            - Scrolling logo carousel
          icon:
            - view_carousel
        _inputs:
          type:
            type: text
            hidden: true
          logos:
            type: array
            label: Logos
            comment: Brand logos in display order.
            options:
              structures: _structures.logoGridLogos
  logoGridLogos:
    values:
      - label: Logo
        icon: image
        value:
          _component: page-sections/features/logo-grid/logo-grid-item
          imageSource: ""
          imageAlt: ""
          visibility: all
        preview:
          text:
            - key: imageAlt
            - Logo
          image:
            - key: imageSource
        _inputs:
          imageSource:
            type: image
            label: Logo image
            comment: Brand logo image.
            options:
              paths:
                uploads: src/assets/images
          imageAlt:
            type: text
            label: Logo alt text
            comment: Describes the logo for screen readers.
          visibility:
            type: select
            label: Visibility
            comment: Where the logo shows — every width, desktop only (hidden at 768px and below), or kept but hidden.
            options:
              values:
                - id: all
                  name: All widths
                - id: desktop
                  name: Desktop only
                - id: hidden
                  name: Hidden
