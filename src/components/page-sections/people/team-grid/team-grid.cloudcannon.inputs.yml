sectionLabel:
  type: text
  comment: Optional label to identify the section in the editor. When set and no HTML id is provided, an id is derived from this value.
eyebrow:
  label: Eyebrow
  comment: Small label above the heading. Leave empty to omit it.
  type: markdown
  options:
    bold: true
    italic: true
    link: true
    subscript: true
    superscript: true
heading:
  label: Heading
  comment: Section heading.
  type: markdown
  options:
    bold: true
    italic: true
    link: true
    subscript: true
    superscript: true
members:
  type: array
  label: Team members
  comment: Employee cards in the grid. The first 8 (4 on small screens) show until the reveal toggle is clicked.
  options:
    structures: _structures.teamMember
showMoreText:
  type: text
  label: Show more label
  comment: Toggle label while the grid is collapsed.
showLessText:
  type: text
  label: Show fewer label
  comment: Toggle label while the grid is expanded.
decorativeImage:
  type: image
  label: Decorative texture
  comment: Brand texture drawn behind the bottom-left of the section. Leave empty to omit it.
  options:
    paths:
      uploads: src/assets/images
decorativeImageAlt:
  type: text
  label: Decorative texture alt text
  comment: Alt text for the texture. Leave empty for a purely decorative image.
maxContentWidth:
  type: select
  comment: Maximum width constraint for the content.
  options:
    values:
      - id: "none"
        name: "None"
      - id: "xs"
        name: "Extra Small"
      - id: "sm"
        name: "Small"
      - id: "md"
        name: "Medium"
      - id: "lg"
        name: "Large"
      - id: "xl"
        name: "Extra Large"
      - id: "2xl"
        name: "2xl"
      - id: "3xl"
        name: "3xl"
      - id: "512px"
        name: "512px (source max-w-lg)"
      - id: "576px"
        name: "576px (source max-w-xl)"
      - id: "672px"
        name: "672px (source max-w-2xl)"
      - id: "896px"
        name: "896px (source max-w-4xl)"
paddingHorizontal:
  type: select
  comment: Horizontal padding of the section content.
  options:
    values:
      - id: "none"
        name: "None"
      - id: "xs"
        name: "Extra Small"
      - id: "sm"
        name: "Small"
      - id: "md"
        name: "Medium"
      - id: "lg"
        name: "Large"
      - id: "xl"
        name: "Extra Large"
      - id: "2xl"
        name: "2xl"
      - id: "3xl"
        name: "3xl"
paddingVertical:
  type: select
  comment: Vertical padding of the section content.
  options:
    values:
      - id: "none"
        name: "None"
      - id: "xs"
        name: "Extra Small"
      - id: "sm"
        name: "Small"
      - id: "md"
        name: "Medium"
      - id: "lg"
        name: "Large"
      - id: "xl"
        name: "Extra Large"
      - id: "2xl"
        name: "2xl"
      - id: "3xl"
        name: "3xl"
      - id: "6xl"
        name: "6xl"
colorScheme:
  type: select
  comment: Colour scheme for the section.
  options:
    values:
      - id: "inherit"
        name: "Inherit"
      - id: "light"
        name: "Light"
      - id: "dark"
