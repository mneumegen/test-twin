      - id: "sky"
        name: "Sky"
      - id: "mint"
        name: "Mint"
      - id: "mint-strong"
        name: "Mint Strong"
      - id: "mint-grid"
        name: "Mint Grid"
      - id: "peach"
        name: "Peach"
