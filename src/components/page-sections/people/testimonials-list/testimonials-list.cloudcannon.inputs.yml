sectionLabel:
  type: text
  label: Section label
  comment: Optional label to identify the section in the editor. When set and no HTML id is provided, an id is derived from this value.
heading:
  label: Heading
  comment: Page heading above the testimonials.
  type: markdown
  options:
    bold: true
    italic: true
    link: true
    subscript: true
    superscript: true
testimonials:
  type: array
  label: Testimonials
  comment: Customer testimonials stacked in a single column.
  options:
    structures: _structures.testimonialItem
maxContentWidth:
  type: select
  label: Max content width
  comment: Maximum width constraint for the content.
  options:
    values:
      - { id: "none", name: None }
      - { id: xs, name: Extra Small }
      - { id: sm, name: Small }
      - { id: md, name: Medium }
      - { id: lg, name: Large }
      - { id: xl, name: Extra Large }
      - { id: 2xl, name: 2xl }
      - { id: 3xl, name: 3xl }
      - { id: 512px, name: 512px (source max-w-lg) }
      - { id: 576px, name: 576px (source max-w-xl) }
      - { id: 672px, name: 672px (source max-w-2xl) }
      - { id: 896px, name: 896px (source max-w-4xl) }
paddingHorizontal:
  type: select
  label: Horizontal padding
  comment: Horizontal padding inside the section.
  options:
    values:
      - { id: "none", name: None }
      - { id: xs, name: Extra Small }
      - { id: sm, name: Small }
      - { id: md, name: Medium }
      - { id: lg, name: Large }
      - { id: xl, name: Extra Large }
      - { id: 2xl, name: 2xl }
      - { id: 3xl, name: 3xl }
paddingVertical:
  type: select
  label: Vertical padding
  comment: Vertical padding inside the section.
  options:
    values:
      - { id: "none", name: None }
      - { id: xs, name: Extra Small }
      - { id: sm, name: Small }
      - { id: md, name: Medium }
      - { id: lg, name: Large }
      - { id: xl, name: Extra Large }
      - { id: 2xl, name: 2xl }
      - { id: 3xl, name: 3xl }
      - { id: 6xl, name: 6xl }
colorScheme:
  type: select
  label: Color scheme
  comment: Color scheme for the section.
  options:
    values:
      - { id: inherit, name: Inherit }
      - { id: light, name: Light }
      - { id: dark, name: Dark }
