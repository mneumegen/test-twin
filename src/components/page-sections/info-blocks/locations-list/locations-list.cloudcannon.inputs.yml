sectionLabel:
  type: text
  label: Section label
  comment: Optional label identifying the section in the editor; also derives the section id.
heading:
  type: markdown
  label: Heading
  comment: Section heading shown above the locations.
  options:
    bold: true
    italic: true
    link: true
    subscript: true
    superscript: true
locations:
  type: array
  label: Locations
  comment: Facility entries, each a map pin, name and address.
  options:
    structures: _structures.locationEntries
maxContentWidth:
  type: select
  label: Max content width
  comment: Maximum width of the section content.
  options:
    values:
      - id: "none"
        name: None
      - id: "xs"
        name: Extra Small
      - id: "sm"
        name: Small
      - id: "md"
        name: Medium
      - id: "lg"
        name: Large
      - id: "xl"
        name: Extra Large
      - id: "2xl"
        name: 2xl
      - id: "3xl"
        name: 3xl
      - id: "512px"
        name: 512px (source max-w-lg)
      - id: "576px"
        name: 576px (source max-w-xl)
      - id: "672px"
        name: 672px (source max-w-2xl)
      - id: "896px"
        name: 896px (source max-w-4xl)
paddingHorizontal:
  type: select
  label: Horizontal padding
  comment: Horizontal padding around the section content.
  options:
    values:
      - id: "none"
        name: None
      - id: "xs"
        name: Extra Small
      - id: "sm"
        name: Small
      - id: "md"
        name: Medium
      - id: "lg"
        name: Large
      - id: "xl"
        name: Extra Large
      - id: "2xl"
        name: 2xl
      - id: "3xl"
        name: 3xl
paddingVertical:
  type: select
  label: Vertical padding
  comment: Vertical padding around the section content.
  options:
    values:
      - id: "none"
        name: None
      - id: "xs"
        name: Extra Small
      - id: "sm"
        name: Small
      - id: "md"
        name: Medium
      - id: "lg"
        name: Large
      - id: "xl"
        name: Extra Large
      - id: "2xl"
        name: 2xl
      - id: "3xl"
        name: 3xl
colorScheme:
  type: select
  label: Color scheme
  comment: Color scheme theme for the section.
  options:
    values:
      - id: "inherit"
        name: Inherit
      - id: "light"
        name: Light
      - id: "dark"
        name: Dark
backgroundColor:
  type: select
  label: Background color
  comment: Solid background color behind the section.
  options:
    values:
      - id: "none"
        name: None
      - id: "base"
        name: Base
      - id: "surface"
        name: Surface
      - id: "accent"
        name: Accent
      - id: "highlight"
        name: Highlight
      - id: "sky"
        name: Sky
      - id: "mint"
        name: Mint
      - id: "mint-strong"
        name: Mint Strong
      - id: "mint-grid"
        name: Mint Grid
      - id: "peach"
        name: Peach
