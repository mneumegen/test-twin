eyebrow:
  type: markdown
  label: Eyebrow
  comment: Short uppercase label above the heading.
  options:
    bold: true
    italic: true
    link: true
    subscript: true
    superscript: true
heading:
  type: markdown
  label: Heading
  options:
    bold: true
    italic: true
    link: true
    subscript: true
    superscript: true
body:
  type: markdown
  label: Body
  comment: Intro sentence below the heading.
  options:
    bold: true
    italic: true
    link: true
    subscript: true
    superscript: true
formAction:
  type: text
  label: Form Action
  comment: URL the password form posts to.
contentId:
  type: text
  label: Content ID
  comment: Value of the hidden content_id field.
redirectUrl:
  type: text
  label: Redirect URL
  comment: Value of the hidden redirect_url field.
passwordLabel:
  type: text
  label: Password Label
  comment: Screen-reader label for the password field.
passwordPlaceholder:
  type: text
  label: Password Placeholder
submitText:
  type: text
  label: Submit Text
maxContentWidth:
  type: select
  label: Max Content Width
  options:
    values:
      - { id: none, name: None }
      - { id: xs, name: Extra Small }
      - { id: sm, name: Small }
      - { id: md, name: Medium }
      - { id: lg, name: Large }
      - { id: xl, name: Extra Large }
      - { id: 2xl, name: 2xl }
      - { id: 3xl, name: 3xl }
      - { id: 512px, name: 512px (source max-w-lg) }
      - { id: 576px, name: 576px (source max-w-xl) }
      - { id: 672px, name: 672px (source max-w-2xl) }
      - { id: 896px, name: 896px (source max-w-4xl) }
