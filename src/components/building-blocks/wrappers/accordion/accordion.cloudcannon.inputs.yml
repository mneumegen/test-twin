label:
  comment: Optional label for the accordion to help identify it in the editor.
  type: text
items:
  comment: The items to display in the accordion.
  type: array
  options:
    structures: _structures.accordionItems
openFirst:
  comment: Whether the first item will be open by default.
  type: switch
singleOpen:
  comment: Whether only one item can be open at a time within this accordion.
  type: switch
titleHeadingLevel:
  comment: Render each item title as a heading of this level wrapping a disclosure button (matches source FAQ markup). "None" keeps the native details/summary row.
  type: select
  options:
    values:
      - id: none
        name: None (details/summary)
      - id: h2
        name: H2
      - id: h3
        name: H3
      - id: h4
        name: H4
      - id: h5
        name: H5
      - id: h6
        name: H6
