collections_config:
  pages:
    path: src/content/pages
    glob:
      - "**/*.md"
    # Matches the live URLs (/about-us, built as about-us.html). The local CloudCannon dev server
    # can't map these to .html files, so its Visual Editor previews show the homepage; hosted
    # CloudCannon is expected to resolve them.
    url: /[full_slug]
    icon: web
    _enabled_editors:
      - visual
    add_options:
      - name: Add New Page
        schema: default
        icon: pages
    schemas:
      default:
        name: New Page
        path: .cloudcannon/schemas/page.md
        remove_extra_inputs: false
    create:
      path: "[relative_base_path]/{filename|slugify|lowercase}.md"
    new_preview_url: /
    _inputs:
      title:
        type: text
        comment: Controls the metadata title for the page.
      keywords:
        type: array
        comment: Optional meta keywords for this page.
      keywords[*]:
        type: text
  products:
    path: src/content/products
    glob:
      - "**/*.md"
    url: /products/[slug]
    name: Products
    icon: inventory_2
    description: Product concepts shown in the Product Library (/products). Each product uses the same page template.
    _enabled_editors:
      - data
    add_options:
      - name: Add Product
        schema: default
        icon: inventory_2
    schemas:
      default:
        name: New Product
        path: .cloudcannon/schemas/product.md
        remove_extra_inputs: false
    create:
      path: "[relative_base_path]/{title|slugify}.md"
    new_preview_url: /products
    sort_options:
      - key: title
        order: asc
    _inputs:
      title:
        type: text
      summary:
        type: textarea
        comment: Short description shown on the product card in the library.
      image:
        type: image
        comment: Square product photo.
      imageAlt:
        type: text
        label: Image alt text
      formats:
        type: multiselect
        label: Product formats
        comment: Used by the Product Format filter.
        options:
          values:
            - id: "bar_soap"
              name: "Bar Soap: Bar Soap"
            - id: "liquid_formulations_skincare"
              name: "Liquid Formulations: Skincare"
            - id: "liquid_formulations_hair_care"
              name: "Liquid Formulations: Hair Care"
            - id: "liquid_formulations_body_personal_care"
              name: "Liquid Formulations: Body Personal Care"
            - id: "liquid_formulations_spf_suncare"
              name: "Liquid Formulations: SPF Suncare"
            - id: "hot_pour_deodorant_natural_deodorant_antiperspirant"
              name: "Hot Pour & Deodorant: Natural Deodorant & Antiperspirant"
            - id: "hot_pour_deodorant_spf_suncare"
              name: "Hot Pour & Deodorant: SPF Suncare"
            - id: "hot_pour_deodorant_skincare_body_care_hair_care"
              name: "Hot Pour & Deodorant: Skincare, Body Care & Hair Care"
      useCases:
        type: multiselect
        label: Use cases
        comment: Used by the Use Cases filter. Labels come from src/data/productTaxonomy.json.
        options:
          values:
            - id: "anti-aging"
              name: "Anti Aging"
            - id: "beauty_products"
              name: "Beauty Products"
            - id: "brightening_even_complexion"
              name: "Brightening Even Complexion"
            - id: "cleansers"
              name: "Cleansers"
            - id: "deodorant"
              name: "Deodorant"
            - id: "exfoliating"
              name: "Exfoliating"
            - id: "eye_lip_care"
              name: "Eye Lip Care"
            - id: "hair_styling_treatments"
              name: "Hair Styling Treatments"
            - id: "home_bath"
              name: "Home Bath"
            - id: "masks"
              name: "Masks"
            - id: "men’s_products"
              name: "Men’s Products"
            - id: "moisturizers"
              name: "Moisturizers"
            - id: "moisturizing"
              name: "Moisturizing"
            - id: "natural_sustainable"
              name: "Natural Sustainable"
            - id: "scalp_care"
              name: "Scalp Care"
            - id: "sensitive_skin"
              name: "Sensitive Skin"
            - id: "serums_toners"
              name: "Serums Toners"
            - id: "shampoo_conditioner"
              name: "Shampoo Conditioner"
            - id: "shaving_grooming"
              name: "Shaving Grooming"
            - id: "soap-free"
              name: "Soap Free"
            - id: "spf_suncare"
              name: "Spf Suncare"
      featuredIngredients:
        type: array
        comment: One line per ingredient. Bold the ingredient name, e.g. **Shea butter** moisturizes skin.
      featuredIngredients[*]:
        type: markdown
        options:
          bold: true
          italic: true
      libraryBase:
        type: text
      naturallyDerived:
        type: text
        comment: e.g. 99.1%
      freeFrom:
        type: array
        label: Free from
      freeFrom[*]:
        type: text
      featured:
        type: switch
        comment: Show in the Current Innovation Collection on /products.
      featuredOrder:
        type: number
        comment: Position within the Current Innovation Collection.
  learningLab:
    path: src/content/learning-lab
    glob:
      - "**/*.mdx"
      - "**/*.md"
    url: /learning-lab/[slug]
    name: Learning Lab
    icon: school
    description: Learning Lab articles. Newest first on /learning-lab.
    _enabled_editors:
      - content
      - data
    add_options:
      - name: Add Article
        schema: default
        icon: article
    schemas:
      default:
        name: New Article
        path: .cloudcannon/schemas/learning-lab-article.mdx
        remove_extra_inputs: false
    create:
      path: "[relative_base_path]/{title|slugify}.mdx"
    new_preview_url: /learning-lab
    sort_options:
      - key: publishedDate
        order: desc
    _inputs:
      title:
        type: text
      description:
        type: textarea
        comment: Used for search engines (and article cards when Excerpt is empty).
      excerpt:
        type: textarea
        comment: Short teaser shown on article cards and Featured Articles.
      image:
        type: image
        label: Featured image
      imageAlt:
        type: text
        label: Featured image alt text
      publishedDate:
        type: datetime
      modifiedDate:
        type: datetime
      author:
        type: select
        options:
          values:
            - id: "anna-keller-director-of-trend-marketing-strategy"
              name: "Anna Keller, Director of Trend & Marketing Strategy"
            - id: "david-rose-associate-director-of-sales"
              name: "David Rose, Associate Director of Sales"
            - id: "emily-spine-associate-director-of-sales"
              name: "Emily Spine, Associate Director of Sales"
            - id: "niamhoconnor"
              name: "Niamh O'Connor, Content Marketing Manager"
            - id: "nina-hudson-director-of-marketing-trend-and-product-innovation"
              name: "Nina Hudson, Director of Marketing, Trend, and Product Innovation"
            - id: "rebecca-adams-digital-marketing-trend-strategist"
              name: "Rebecca Adams, Digital Marketing & Trend Strategist"
            - id: "twincraft"
              name: "Twincraft"
            - id: "wayne-labonte-vp-sales-marketing"
              name: "Wayne LaBonte, VP Sales & Marketing"
      tags:
        type: multiselect
        options:
          values:
            - id: "product-development"
              name: "product development"
            - id: "trends-innovation"
              name: "Trends & Innovation"
            - id: "formulation"
              name: "formulation"
            - id: "news-updates"
              name: "news & updates"
            - id: "regulatory"
              name: "regulatory"
      featured:
        type: switch
        comment: Show under Featured Articles on /learning-lab.
# Editor uploads go where Astro can optimize them (paths are stored as /src/assets/images/...).
paths:
  uploads: src/assets/images
collection_groups:
  - heading: Content
    collections:
      - pages
      - products
      - learningLab
  - heading: Data
    collections:
      - data
_inputs:
