navData:
  style: modal
  values:
    - label: Menu
      icon: menu
      description: A top-level menu with a featured image, caption, link columns and a call to action.
      value:
        name: ""
        featuredImage:
          source: ""
          alt: ""
        caption: ""
        columns: []
        cta:
          text: ""
          link: ""
      preview:
        text:
          - key: name
          - Menu
        subtext:
          - key: caption
        image:
          - key: featuredImage.source
      picker_preview:
        text: Menu
        subtext: A top-level menu with a featured image, caption, link columns and a call to action.
        icon: menu
      _inputs:
        name:
          type: text
          label: Menu name
          comment: Label shown in the header.
        featuredImage:
          type: object
          label: Featured image
          comment: Image on the left of the open menu.
        source:
          type: image
          label: Image
          options:
            paths:
              uploads: src/assets/images
        alt:
          type: text
          label: Alt text
          comment: Describes the image for screen readers.
        caption:
          type: textarea
          label: Caption
          comment: Short paragraph under the featured image.
        columns:
          type: array
          label: Columns
          comment: Each column has a heading link and a list of links.
          options:
            structures:
              values:
                - label: Column
                  icon: view_column
                  value:
                    name: ""
                    path: ""
                    subtext: ""
                    links: []
                  preview:
                    text:
                      - key: name
                      - Column
                    subtext:
                      - key: path
                  _inputs:
                    name:
                      type: text
                      label: Heading
                    path:
                      type: url
                      label: Heading link
                      options:
                        hide_link_to_file: true
                        hide_link_to_email_address: true
                        hide_link_to_telephone: true
                    subtext:
                      type: text
                      label: Subtext
                      comment: Optional line under the heading.
        cta:
          type: object
          label: Call to action
          comment: Link at the bottom of the open menu. Leave the text empty to hide it.
        text:
          type: text
          label: Button text
        link:
          type: url
          label: Button link
          options:
            hide_link_to_file: true
            hide_link_to_email_address: true
            hide_link_to_telephone: true
